name: Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'WpfWidgets.csproj'
  CONFIGURATION: 'Release'

jobs:
  validate-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build project
        run: |
          dotnet build ${{ env.PROJECT_PATH }} --configuration ${{ env.CONFIGURATION }}
        shell: pwsh
